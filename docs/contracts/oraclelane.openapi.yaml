openapi: 3.1.0
info:
  title: Oraclelane API
  version: 1.1.0
  description: Task-oriented API for DreamDEX Event Contract discovery, thesis, trade preparation, and settlement projections.
servers:
  - url: https://api.oraclelane.app/api/v1
paths:
  /auth/challenges:
    post:
      operationId: createWalletChallenge
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WalletChallengeRequest'}}}}
      responses:
        '201': {description: Wallet challenge, content: {application/json: {schema: {$ref: '#/components/schemas/WalletChallengeResponse'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /auth/sessions:
    post:
      operationId: createWalletSession
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WalletSessionRequest'}}}}
      responses:
        '200': {description: Wallet session, content: {application/json: {schema: {$ref: '#/components/schemas/WalletSessionResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /markets:
    get:
      operationId: listMarkets
      parameters:
        - {name: chainId, in: query, required: true, schema: {type: integer, enum: [50312, 50313, 5031]}}
        - {name: status, in: query, schema: {type: string, enum: [OPEN, PAUSED, LOCKED, RESOLVED, VOID]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200': {description: Market list, content: {application/json: {schema: {$ref: '#/components/schemas/MarketListResponse'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
  /markets/{marketId}:
    get:
      operationId: getMarket
      parameters:
        - {name: marketId, in: path, required: true, schema: {type: string}}
        - {name: chainId, in: query, required: true, schema: {type: integer}}
      responses:
        '200': {description: Market, content: {application/json: {schema: {$ref: '#/components/schemas/MarketResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /theses:
    post:
      operationId: createThesis
      description: Creates or returns an expiry-bound advisory thesis for the server-validated market snapshot. The client cannot submit prompts or evidence.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ThesisRequest'}}}}
      responses:
        '200': {description: Still-valid cached thesis, content: {application/json: {schema: {$ref: '#/components/schemas/ThesisResponse'}}}}
        '201': {description: Newly generated thesis, content: {application/json: {schema: {$ref: '#/components/schemas/ThesisResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamRejected'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
  /trade-previews:
    post:
      operationId: createTradePreview
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TradePreviewRequest'}}}}
      responses:
        '200': {description: Trade preview, content: {application/json: {schema: {$ref: '#/components/schemas/TradePreviewResponse'}}}}
        '409': {$ref: '#/components/responses/StateConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /transactions/observations:
    post:
      operationId: observeTransaction
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransactionObservationRequest'}}}}
      responses:
        '202': {description: Observation accepted, content: {application/json: {schema: {$ref: '#/components/schemas/TransactionObservationResponse'}}}}
  /positions:
    get:
      operationId: listPositions
      security: [{bearerAuth: []}]
      parameters:
        - {name: owner, in: query, required: true, schema: {type: string, pattern: '^0x[a-fA-F0-9]{40}$'}}
        - {name: chainId, in: query, required: true, schema: {type: integer}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {description: Position list, content: {application/json: {schema: {$ref: '#/components/schemas/PositionListResponse'}}}}
  /positions/{positionId}:
    get:
      operationId: getPosition
      security: [{bearerAuth: []}]
      parameters:
        - {name: positionId, in: path, required: true, schema: {type: string}}
        - {name: chainId, in: query, required: true, schema: {type: integer}}
      responses:
        '200': {description: Position detail, content: {application/json: {schema: {$ref: '#/components/schemas/PositionResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /positions/{positionId}/redeem-intents:
    post:
      operationId: createRedeemIntent
      security: [{bearerAuth: []}]
      parameters: [{name: positionId, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RedeemIntentRequest'}}}}
      responses:
        '201': {description: EIP-712 intent, content: {application/json: {schema: {$ref: '#/components/schemas/RedeemIntentResponse'}}}}
        '409': {$ref: '#/components/responses/StateConflict'}
  /redeem-intents/{intentId}/signature:
    post:
      operationId: submitRedeemSignature
      security: [{bearerAuth: []}]
      parameters: [{name: intentId, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RedeemSignatureRequest'}}}}
      responses:
        '202': {description: Signature accepted and redemption queued, content: {application/json: {schema: {$ref: '#/components/schemas/RedeemSignatureResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /health:
    get:
      operationId: health
      responses: {'200': {description: Healthy, content: {application/json: {schema: {$ref: '#/components/schemas/HealthResponse'}}}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-wallet-session
  schemas:
    WalletChallengeRequest:
      type: object
      required: [address, chainId]
      properties:
        address: {type: string, pattern: '^0x[a-fA-F0-9]{40}$'}
        chainId: {type: integer, enum: [50312, 50313, 5031]}
    WalletChallengeResponse:
      type: object
      required: [data]
      properties:
        data: {type: object, required: [challengeId, nonce, message, expiresAt], properties: {challengeId: {type: string}, nonce: {type: string}, message: {type: string}, expiresAt: {type: string, format: date-time}}}
    WalletSessionRequest:
      type: object
      required: [address, chainId, challengeId, signature]
      properties:
        address: {type: string, pattern: '^0x[a-fA-F0-9]{40}$'}
        chainId: {type: integer}
        challengeId: {type: string}
        signature: {type: string}
    WalletSessionResponse:
      type: object
      required: [data]
      properties:
        data: {type: object, required: [accessToken, address, chainId, expiresAt], properties: {accessToken: {type: string}, address: {type: string}, chainId: {type: integer}, expiresAt: {type: string, format: date-time}}}
    Market:
      type: object
      required: [marketId, chainId, question, status, outcomes, closeAt, observedAt, freshness]
      properties:
        marketId: {type: string}
        chainId: {type: integer}
        question: {type: string}
        status: {type: string, enum: [OPEN, PAUSED, LOCKED, RESOLVED, VOID]}
        outcomes: {type: array, items: {$ref: '#/components/schemas/Outcome'}}
        closeAt: {type: string, format: date-time}
        observedAt: {type: string, format: date-time}
        freshness: {type: string, enum: [FRESH, STALE, UNKNOWN]}
    Outcome:
      type: object
      required: [index, label, price, tokenAddress]
      properties:
        index: {type: integer, minimum: 0}
        label: {type: string}
        price: {type: string, description: Decimal string; never use binary floating point for settlement math.}
        tokenAddress: {type: string}
    MarketListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Market'}}
        meta: {$ref: '#/components/schemas/PageMeta'}
    MarketResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Market'}}}
    ThesisRequest:
      type: object
      additionalProperties: false
      required: [marketId, chainId]
      properties:
        marketId: {type: string, minLength: 1, maxLength: 256}
        chainId: {type: integer, enum: [50312, 50313, 5031]}
        maxAgeSeconds: {type: integer, minimum: 30, maximum: 900, default: 300, description: Maximum acceptable age of a reusable validated thesis. This does not extend expiresAt.}
    Thesis:
      type: object
      additionalProperties: false
      required: [thesisId, marketId, chainId, marketVersion, direction, confidenceBand, summary, drivers, risks, evidence, evidenceHash, generatedAt, expiresAt, modelVersion, promptVersion]
      properties:
        thesisId: {type: string, minLength: 1}
        marketId: {type: string, minLength: 1}
        chainId: {type: integer, enum: [50312, 50313, 5031]}
        marketVersion: {type: string, minLength: 1, description: Opaque version of the server-validated market snapshot used to generate this thesis.}
        direction: {type: string, enum: [UP, DOWN, NO_TRADE]}
        confidenceBand: {type: string, enum: [LOW, MEDIUM, HIGH]}
        summary: {type: string, minLength: 1, maxLength: 1200}
        drivers: {type: array, minItems: 1, maxItems: 3, items: {type: string, minLength: 1, maxLength: 280}}
        risks: {type: array, minItems: 1, maxItems: 3, items: {type: string, minLength: 1, maxLength: 280}}
        evidence: {type: array, minItems: 1, maxItems: 8, items: {$ref: '#/components/schemas/Evidence'}}
        evidenceHash: {type: string, pattern: '^sha256:[a-f0-9]{64}$', description: Hash of the canonical bounded evidence packet.}
        generatedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        modelVersion: {type: string, minLength: 1, maxLength: 128}
        promptVersion: {type: string, minLength: 1, maxLength: 128}
    Evidence:
      type: object
      additionalProperties: false
      required: [sourceId, title, url, retrievedAt, relevance]
      properties:
        sourceId: {type: string, minLength: 1, maxLength: 128}
        title: {type: string, minLength: 1, maxLength: 240}
        url: {type: string, format: uri, pattern: '^https://'}
        publishedAt: {type: [string, 'null'], format: date-time}
        retrievedAt: {type: string, format: date-time}
        relevance: {type: string, enum: [PRIMARY, SECONDARY, MARKET_DATA]}
    ThesisResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/Thesis'}
        meta: {$ref: '#/components/schemas/ThesisMeta'}
    ThesisMeta:
      type: object
      additionalProperties: false
      required: [requestId, cacheStatus]
      properties:
        requestId: {type: string, minLength: 1}
        cacheStatus: {type: string, enum: [HIT, MISS]}
    TradePreviewRequest:
      type: object
      required: [owner, marketId, chainId, outcomeIndex, amount]
      properties:
        owner: {type: string, pattern: '^0x[a-fA-F0-9]{40}$'}
        marketId: {type: string}
        chainId: {type: integer}
        outcomeIndex: {type: integer, minimum: 0, maximum: 1}
        amount: {type: string, pattern: '^[0-9]+$'}
        maxSlippageBps: {type: integer, minimum: 0, maximum: 500}
    SafetyDecision:
      type: object
      required: [decision, checks]
      properties:
        decision: {type: string, enum: [ALLOW, WARN, BLOCK]}
        checks: {type: array, items: {type: object, required: [code, passed], properties: {code: {type: string}, passed: {type: boolean}, message: {type: string}}}}
    TradePreview:
      type: object
      required: [previewId, marketVersion, amount, safety, expiresAt, transaction]
      properties:
        previewId: {type: string}
        marketVersion: {type: string}
        amount: {type: string}
        safety: {$ref: '#/components/schemas/SafetyDecision'}
        expiresAt: {type: string, format: date-time}
        transaction: {type: object, required: [to, data, value, chainId], properties: {to: {type: string}, data: {type: string}, value: {type: string}, chainId: {type: integer}}}
    TradePreviewResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/TradePreview'}}}
    TransactionObservationRequest:
      type: object
      required: [owner, chainId, txHash, previewId]
      properties:
        owner: {type: string}
        chainId: {type: integer}
        txHash: {type: string}
        previewId: {type: string}
    TransactionObservationResponse: {type: object, required: [data], properties: {data: {type: object, required: [observationId, status], properties: {observationId: {type: string}, status: {type: string, enum: [PENDING, CONFIRMED, FAILED]}}}}}
    Position:
      type: object
      required: [positionId, owner, marketId, outcomeIndex, amount, status]
      properties:
        positionId: {type: string}
        owner: {type: string}
        marketId: {type: string}
        outcomeIndex: {type: integer}
        amount: {type: string}
        status: {type: string, enum: [PENDING, OPEN, LOCKED, FINALIZED, VOID, REDEEM_INTENT, REDEEM_SUBMITTED, REDEEMED, MANUAL_ACTION_REQUIRED]}
        txHash: {type: [string, 'null']}
        winningOutcome: {type: [integer, 'null']}
    PositionListResponse: {type: object, required: [data, meta], properties: {data: {type: array, items: {$ref: '#/components/schemas/Position'}}, meta: {$ref: '#/components/schemas/PageMeta'}}}
    PositionResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Position'}}}
    RedeemIntentRequest:
      type: object
      required: [deadline]
      properties: {deadline: {type: string, format: date-time}}
    RedeemIntentResponse:
      type: object
      required: [data]
      properties:
        data: {type: object, required: [intentId, typedData, status], properties: {intentId: {type: string}, status: {type: string, enum: [AWAITING_SIGNATURE, SIGNED, EXPIRED]}, typedData: {type: object, additionalProperties: true}}}
    RedeemSignatureRequest:
      type: object
      required: [owner, signature]
      properties:
        owner: {type: string, pattern: '^0x[a-fA-F0-9]{40}$'}
        signature: {type: string, description: Owner EIP-712 signature; never log or expose after validation.}
    RedeemSignatureResponse:
      type: object
      required: [data]
      properties:
        data: {type: object, required: [intentId, status], properties: {intentId: {type: string}, status: {type: string, enum: [SIGNED, SUBMISSION_QUEUED, SUBMITTED, CONFIRMED, FAILED, MANUAL_ACTION_REQUIRED]}, txHash: {type: [string, 'null']}}}
    PageMeta:
      type: object
      required: [hasNext]
      properties: {hasNext: {type: boolean}, nextCursor: {type: [string, 'null']}}
    HealthResponse:
      type: object
      required: [data]
      properties: {data: {type: object, required: [status, version], properties: {status: {type: string, enum: [ok, degraded]}, version: {type: string}, releaseSha: {type: string}}}}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        requestId: {type: string}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: array, items: {type: object}}
  responses:
    ValidationError: {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthorized: {description: Missing or invalid wallet session, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Wallet session does not own this resource, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    StateConflict: {description: State conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    RateLimited: {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    UpstreamRejected: {description: Provider output or citations failed validation and no thesis was returned, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    UpstreamUnavailable: {description: Upstream unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
